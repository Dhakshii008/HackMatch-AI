# Render blueprint for HackMatch AI
# Deploy with:  https://render.com/deploy  (or `render blueprint launch`)
#
# You must set MONGO_URI to a public MongoDB Atlas connection string first,
# otherwise the backend will not be able to reach a database.

services:
  - type: web
    name: hackmatch-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: MONGODB_URI
        sync: false          # set to your MongoDB Atlas URI
      - key: CLIENT_URL
        sync: false          # set to https://dhakshii008.github.io
